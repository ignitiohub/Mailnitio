# Local development services for Mailnitio only.
# Everything is namespaced "mailnitio" (compose project, container, volume, network) and the
# host port is non-default (54329) so it cannot clash with other projects' Postgres containers.
name: mailnitio

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mailnitio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailnitio_owner
      POSTGRES_PASSWORD: mailnitio_owner_dev
      POSTGRES_DB: mailnitio
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - mailnitio_pgdata:/var/lib/postgresql/data
    networks:
      - mailnitio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailnitio_owner -d mailnitio"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mailnitio_pgdata:
    name: mailnitio_pgdata

networks:
  mailnitio:
    name: mailnitio
